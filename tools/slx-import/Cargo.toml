[package]
name = "slx-import"
version = "0.1.0"
edition = "2021"
description = "Parser and analyzer for Simulink .slx model files"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.5.26", features = ["derive"] }
env_logger = "0.11.6"
log = "0.4.25"
serde = { version = "1.0", features = ["derive"] }
serde-xml-rs = "0.6.0"
serde_with = "3.12.0"
walkdir = "2.4"
zip = "2.2.2"
